[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock"
version = "0.1.0"
description = "A Python CLI alarm clock with daemon support"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
alarm = "alarm_clock.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alarm_clock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
